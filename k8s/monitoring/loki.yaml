apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 1h
  releaseName: loki
  targetNamespace: loki
  storageNamespace: loki
  chart:
    spec:
      chart: loki
      version: 21.0.0
      sourceRef:
        kind: HelmRepository
        name: grafana-community
      interval: 12h
  timeout: 10m
  # Adopts the release Argo CD rendered: Helm takes ownership of the existing
  # objects. A failed install is left for a person rather than uninstalled,
  # which would delete the live workloads.
  install:
    crds: CreateReplace
    remediation:
      retries: 0
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  # Its ServiceMonitors and rules need the Prometheus Operator CRDs.
  dependsOn:
    - name: kube-prometheus-stack
  values:
    deploymentMode: Monolithic
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      limits_config:
        retention_period: 168h
      rulerConfig:
        alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
        storage:
          type: local
          local:
            directory: /var/loki/rules
        rule_path: /var/loki/rules-temp
        ring:
          kvstore:
            store: inmemory
        enable_api: true
      storage:
        type: filesystem
    singleBinary:
      replicas: 1
      resources:
        requests:
          memory: 256Mi
        limits:
          memory: 512Mi
      persistence:
        storageClass: local-path
        size: 10Gi
      extraVolumes:
        - name: alerting-rules
          configMap:
            name: loki-alerting-rules
      extraVolumeMounts:
        - name: alerting-rules
          mountPath: /var/loki/rules/fake
          readOnly: true
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0
    gateway:
      enabled: false
    resultsCache:
      enabled: false
    chunksCache:
      enabled: false
    extraObjects:
      - apiVersion: v1
        kind: ConfigMap
        metadata:
          name: loki-alerting-rules
        data:
          rules.yaml: |
            groups:
              - name: application-errors
                rules:
                  - alert: ApplicationError
                    expr: |
                      sum by (namespace, app, level) (
                        count_over_time({namespace="refinery"} | json | level=~"error|fatal" [1m])
                      ) > 0
                    for: 0m
                    labels:
                      severity: critical
                    annotations:
                      summary: "{{`{{ $labels.level | title }} in {{ $labels.namespace }}/{{ $labels.app }}`}}"
                      description: "{{`{{ $labels.namespace }}/{{ $labels.app }} logged {{ $value }} {{ $labels.level }}-level message(s) in the last minute.`}}"
              - name: hestia
                rules:
                  # zigbee2mqtt logs a bridge/health publish every 10 minutes. After an
                  # adapter crash it can hang on shutdown while systemd still reports it
                  # active, which Zigbee2mqttDown in Prometheus cannot see.
                  - alert: Zigbee2mqttStalled
                    expr: |
                      absent_over_time({instance="hestia", unit="zigbee2mqtt.service"} |= "bridge/health" [30m])
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: zigbee2mqtt on hestia has stopped working.
                      description: zigbee2mqtt on hestia has logged no health check for over 30 minutes, so every Zigbee entity in Home Assistant is unavailable. Restart zigbee2mqtt.service.
