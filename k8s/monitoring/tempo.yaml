apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: flux-system
spec:
  interval: 1h
  releaseName: tempo
  targetNamespace: tempo
  storageNamespace: tempo
  chart:
    spec:
      chart: tempo
      version: 3.2.1
      sourceRef:
        kind: HelmRepository
        name: grafana-community
      interval: 12h
  timeout: 10m
  # Adopts the release Argo CD rendered: Helm takes ownership of the existing
  # objects. A failed install is left for a person rather than uninstalled,
  # which would delete the live workloads.
  install:
    crds: CreateReplace
    remediation:
      retries: 0
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  # Its ServiceMonitors and rules need the Prometheus Operator CRDs.
  dependsOn:
    - name: kube-prometheus-stack
  values:
    tempo:
      metricsGenerator:
        enabled: true
        remoteWriteUrl: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
      overrides:
        defaults:
          # retention below only reaches the backend scheduler; the
          # worker that deletes blocks would keep its 336h default.
          compaction:
            block_retention: 168h
          metrics_generator:
            processors:
              - service-graphs
              - span-metrics
      storage:
        trace:
          backend: local
          local:
            path: /var/tempo/traces
          wal:
            path: /var/tempo/wal
      retention: 168h
      # It peaked at ~760Mi over a week; the Go GC backs off before the
      # limit instead of being OOM-killed.
      resources:
        requests:
          memory: 256Mi
        limits:
          memory: 1Gi
      extraEnv:
        - name: GOMEMLIMIT
          value: 900MiB
    persistence:
      enabled: true
      storageClassName: local-path
      size: 10Gi
