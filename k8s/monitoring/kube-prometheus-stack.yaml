apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 1h
  releaseName: kube-prometheus-stack
  targetNamespace: monitoring
  storageNamespace: monitoring
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 93.0.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      interval: 12h
  timeout: 10m
  # Adopts the release Argo CD rendered: Helm takes ownership of the existing
  # objects. A failed install is left for a person rather than uninstalled,
  # which would delete the live workloads.
  install:
    crds: CreateReplace
    remediation:
      retries: 0
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    grafana:
      # The chart lags Grafana's security releases, so pin the patched image.
      image:
        # renovate: datasource=docker depName=grafana/grafana
        tag: 13.3.2-distroless
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.miksu.app
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-dns
          traefik.ingress.kubernetes.io/router.middlewares: monitoring-tailnet-only@kubernetescrd
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.miksu.app
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: false
      grafana.ini:
        # Tailnet clients read without logging in; agents use the
        # datasource proxy. Editing still needs the admin login.
        auth.anonymous:
          enabled: true
          org_role: Viewer
      resources:
        requests:
          memory: 256Mi
        limits:
          memory: 512Mi
      additionalDataSources:
        - name: Loki
          type: loki
          # Tempo's trace-to-logs link and agent queries refer to this UID.
          uid: loki
          url: http://loki.loki.svc.cluster.local:3100
          access: proxy
          isDefault: false
          jsonData:
            derivedFields:
              - name: TraceID
                matcherRegex: '"trace_id":"(\w+)"'
                url: "$${__value.raw}"
                datasourceUid: tempo
                matcherType: regex
        - name: Tempo
          type: tempo
          uid: tempo
          url: http://tempo.tempo.svc.cluster.local:3200
          access: proxy
          isDefault: false
          jsonData:
            tracesToLogsV2:
              datasourceUid: loki
              filterByTraceID: false
              filterBySpanID: false
            tracesToMetrics:
              datasourceUid: prometheus
            nodeGraph:
              enabled: true
            serviceMap:
              datasourceUid: prometheus
    prometheus:
      prometheusSpec:
        enableRemoteWriteReceiver: true
        # Hestia and tpad queue OTLP for up to 24h while offline; without
        # this, samples older than the head (about an hour) are rejected.
        tsdb:
          outOfOrderTimeWindow: 24h
        scrapeInterval: 60s
        retention: 7d
        resources:
          requests:
            memory: 512Mi
          limits:
            memory: 1Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              resources:
                requests:
                  storage: 10Gi
    alertmanager:
      alertmanagerSpec:
        secrets:
          - alertmanager-telegram-token
        resources:
          requests:
            memory: 32Mi
          limits:
            memory: 64Mi
      config:
        global:
          resolve_timeout: 5m
        route:
          receiver: telegram
          group_by: ["alertname", "namespace"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          routes:
            - receiver: "null"
              matchers:
                - alertname = "Watchdog"
            - receiver: "null"
              matchers:
                - alertname = "InfoInhibitor"
        receivers:
          - name: "null"
          - name: telegram
            telegram_configs:
              - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram-token/bot-token
                chat_id: -1003049249814
                parse_mode: HTML
                message: "{{ range .Alerts }}\n{{ if eq .Status \"firing\" }}\U0001F525{{ else }}✅{{ end }} <b>{{ .Labels.alertname }}</b>\n<b>Severity:</b> {{ .Labels.severity }}\n<b>Namespace:</b> {{ .Labels.namespace }}\n{{ if .Annotations.description }}{{ .Annotations.description }}{{ else }}{{ .Annotations.summary }}{{ end }}\n{{ end }}"
        inhibit_rules:
          - source_matchers:
              - severity = "critical"
            target_matchers:
              - severity = "warning"
            equal: ["alertname", "namespace"]
    # Slow failures the default rules miss: a container that sits at its memory
    # limit thrashes on page faults, and restarts spread over hours never
    # trip KubePodCrashLooping.
    additionalPrometheusRulesMap:
      container-health:
        groups:
          - name: container-health
            rules:
              - alert: ContainerMemoryNearLimit
                expr: |
                  max by (namespace, pod, container) (container_memory_working_set_bytes{container!="", image!=""})
                    / on (namespace, pod, container)
                  max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"})
                    > 0.9
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: Container is close to its memory limit.
                  description: "{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} has used {{ $value | humanizePercentage }} of its memory limit for 30 minutes."
              - alert: ContainerRestartingOften
                # increase() extrapolates (3 restarts read as ~3.02), so round before comparing.
                # The 24h window keeps deleted pods' samples; only alert on live containers.
                expr: |
                  round(increase(kube_pod_container_status_restarts_total[24h])) > 3
                    and on (namespace, pod, container) kube_pod_container_status_restarts_total
                labels:
                  severity: warning
                annotations:
                  summary: Container keeps restarting.
                  description: "{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} restarted {{ $value | humanize }} times in the last 24 hours."
      hestia:
        groups:
          - name: hestia
            rules:
              # Hestia pushes over OTLP, so silence means it froze or lost the tailnet.
              - alert: HestiaDown
                expr: absent_over_time(node_boot_time_seconds{instance="hestia"}[5m])
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: No metrics from hestia.
                  description: Hestia has sent no metrics for 10 minutes. It may be frozen or off the tailnet.
              - alert: Zigbee2mqttDown
                # A crash loop restarts every minute or so and reads as active most of
                # the time, so also alert on repeated restarts.
                expr: |
                  increase(node_systemd_service_restart_total{instance="hestia", name="zigbee2mqtt.service"}[15m]) > 2
                    or max without (state, type) (node_systemd_unit_state{instance="hestia", name="zigbee2mqtt.service", state="active"}) == 0
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: zigbee2mqtt is not running on hestia.
                  description: zigbee2mqtt.service on hestia has been stopped or restarting repeatedly for 10 minutes.
    prometheusOperator:
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 128Mi
    prometheus-node-exporter:
      # Names the olympus node in dashboards; hestia pushes as "hestia".
      prometheus:
        monitor:
          relabelings:
            - sourceLabels: [__address__]
              regex: '89\.167\.124\.71:9100'
              action: replace
              targetLabel: instance
              replacement: olympus
      resources:
        requests:
          memory: 32Mi
        limits:
          memory: 64Mi
    kube-state-metrics:
      resources:
        requests:
          memory: 32Mi
        limits:
          memory: 64Mi
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeProxy:
      enabled: false
    # Only tailnet clients reach Grafana, as with k8s/flux-ui.
    extraManifests:
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: tailnet-only
          namespace: monitoring
        spec:
          ipAllowList:
            sourceRange:
              - 100.64.0.0/10
              - fd7a:115c:a1e0::/48
      # Viewers, anonymous ones included, can send the datasource proxy any
      # GET (Loki's /ingester/shutdown stops Loki) and any Tempo write, and
      # the resource route any Prometheus POST (/-/quit stops Prometheus).
      # Only reads get through.
      - apiVersion: traefik.io/v1alpha1
        kind: IngressRoute
        metadata:
          name: grafana-datasource-proxy-guard
          namespace: monitoring
        spec:
          entryPoints:
            - websecure
          routes:
            - kind: Rule
              match: >-
                Host(`grafana.miksu.app`) && PathPrefix(`/api/datasources/proxy/`) && !(Method(`GET`) && PathRegexp(`^/api/datasources/proxy/uid/(tempo/api|loki/loki/api/v1|prometheus/api/v1)/`))
              middlewares:
                - name: deny-all
              services:
                - name: kube-prometheus-stack-grafana
                  port: 80
            - kind: Rule
              # The Prometheus datasource POSTs its queries (httpMethod).
              match: >-
                Host(`grafana.miksu.app`) && PathRegexp(`^/api/datasources/uid/[^/]+/resources/`) && !Method(`GET`) && !PathRegexp(`^/api/datasources/uid/prometheus/resources/api/v1/(query|query_range|query_exemplars|series|labels|label/[^/]+/values|metadata)$`)
              middlewares:
                - name: deny-all
              services:
                - name: kube-prometheus-stack-grafana
                  port: 80
          tls:
            secretName: grafana-tls
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: deny-all
          namespace: monitoring
        spec:
          # Every client reaches Traefik from a non-loopback address.
          ipAllowList:
            sourceRange:
              - 127.0.0.1/32
