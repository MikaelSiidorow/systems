apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  releaseName: cert-manager
  targetNamespace: cert-manager
  storageNamespace: cert-manager
  chart:
    spec:
      chart: cert-manager
      version: v1.21.3
      sourceRef:
        kind: HelmRepository
        name: jetstack
      interval: 12h
  timeout: 10m
  # Adopts the release k3s installed as an upgrade of the same release, so
  # the install settings only matter on a fresh cluster. Uninstalling keeps
  # the CRDs and Certificates (crds.keep defaults to true).
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # The chart templates its CRDs, so Helm upgrades them with the release.
    crds:
      enabled: true
