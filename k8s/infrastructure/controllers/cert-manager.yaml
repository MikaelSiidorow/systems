apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  releaseName: cert-manager
  targetNamespace: cert-manager
  storageNamespace: cert-manager
  chart:
    spec:
      chart: cert-manager
      version: v1.21.3
      sourceRef:
        kind: HelmRepository
        name: jetstack
      interval: 12h
  timeout: 10m
  # Adopts the release k3s installed, as an upgrade of the same release. A
  # failed install is left for a person rather than uninstalled, which would
  # delete the CRDs and every Certificate with them.
  install:
    createNamespace: true
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # The chart templates its CRDs, so Helm upgrades them with the release.
    crds:
      enabled: true
