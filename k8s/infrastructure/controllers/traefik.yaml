apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 1h
  releaseName: traefik
  targetNamespace: traefik
  storageNamespace: traefik
  chart:
    spec:
      chart: traefik
      version: 42.4.3
      sourceRef:
        kind: HelmRepository
        name: traefik
      interval: 12h
  timeout: 10m
  # Adopts the release k3s installed as an upgrade of the same release, so
  # the install settings only matter on a fresh cluster. The chart's CRDs sit
  # in its crds/ directory, which Helm skips on upgrade unless told to replace
  # them; uninstalling leaves them in place.
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # Keep client addresses for the tailnet-only allowlists. ServiceLB
    # masquerades what it forwards, so kube-proxy has to take the tailnet
    # address too, as it does the public one.
    service:
      spec:
        externalTrafficPolicy: Local
        externalIPs:
          - 100.64.0.1
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
