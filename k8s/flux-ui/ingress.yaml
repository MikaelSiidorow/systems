apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flux-operator
  namespace: flux-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
    traefik.ingress.kubernetes.io/router.middlewares: flux-system-tailnet-only@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - flux.miksu.app
      secretName: flux-tls
  rules:
    - host: flux.miksu.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flux-operator
                port:
                  number: 9080
---
# Only tailnet clients; the tailnet DNS record alone does not stop anyone
# sending the host name to the public address.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tailnet-only
  namespace: flux-system
spec:
  ipAllowList:
    sourceRange:
      - 100.64.0.0/10
      - fd7a:115c:a1e0::/48
