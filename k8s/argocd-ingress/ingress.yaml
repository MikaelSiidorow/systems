apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
    traefik.ingress.kubernetes.io/router.middlewares: argocd-tailnet-only@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - argocd.miksu.app
      secretName: argocd-tls
  rules:
    - host: argocd.miksu.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
---
# Only tailnet clients; the tailnet DNS record alone does not stop anyone
# sending the host name to the public address.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tailnet-only
  namespace: argocd
spec:
  ipAllowList:
    sourceRange:
      - 100.64.0.0/10
      - fd7a:115c:a1e0::/48
