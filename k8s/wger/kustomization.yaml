apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wger
# The public Ingress is in k8s/wger-ingress, which Flux applies only once
# everything here, including the bootstrap Job that replaces wger's default
# admin password, is ready.
resources:
  - namespace.yaml
  - wger-secrets.sops.yaml
  - wger-admin-bootstrap.sops.yaml
  - wger-email.sops.yaml
  - db.yaml
  - storage.yaml
  - services.yaml
  - redis.yaml
  - web.yaml
  - celery.yaml
  - bootstrap.yaml
  - powersync.yaml
  - fineli-import.yaml
  - monitoring.yaml
configMapGenerator:
  - name: wger-config
    envs:
      - config/wger.env
    files:
      - powersync.yaml=config/powersync.yaml
      - sync_rules.yaml=config/sync_rules.yaml
      - nginx.conf=config/nginx.conf
      - redis.conf=config/redis.conf
  - name: wger-bootstrap
    files:
      - bootstrap.py=config/bootstrap.py
  - name: wger-fineli-import
    files:
      - import-fineli.py=config/import-fineli.py
