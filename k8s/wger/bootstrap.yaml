apiVersion: batch/v1
kind: Job
metadata:
  name: wger-bootstrap
  namespace: wger
  annotations:
    # Jobs are immutable: Flux recreates, and so reruns, this one whenever its
    # spec changes. Delete it to rerun it with the same spec.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 3600
  template:
    spec:
      restartPolicy: OnFailure
      # wger-web migrates the database when it starts; Argo CD used to run
      # this Job only after wger-web was healthy. Wait for the migrations here.
      initContainers:
        - name: wait-for-migrations
          image: ghcr.io/mikaelsiidorow/wger:production
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
          args:
            - until python3 manage.py migrate --check >/dev/null; do echo "Waiting for wger-web's migrations"; sleep 10; done
          envFrom:
            - configMapRef:
                name: wger-config
            - secretRef:
                name: wger-secrets
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 384Mi
      containers:
        - name: bootstrap
          image: ghcr.io/mikaelsiidorow/wger:production
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -ec
          args:
            - python3 manage.py shell < /config/bootstrap.py
          envFrom:
            - configMapRef:
                name: wger-config
            - secretRef:
                name: wger-secrets
            - secretRef:
                name: wger-admin-bootstrap
          volumeMounts:
            - name: config
              mountPath: /config/bootstrap.py
              subPath: bootstrap.py
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 384Mi
      volumes:
        - name: config
          configMap:
            name: wger-bootstrap
            items:
              - key: bootstrap.py
                path: bootstrap.py
