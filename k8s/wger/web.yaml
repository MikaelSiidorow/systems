apiVersion: apps/v1
kind: Deployment
metadata:
  name: wger-web
  namespace: wger
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wger-web
  template:
    metadata:
      labels:
        app: wger-web
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: web
          image: ghcr.io/mikaelsiidorow/wger:production
          imagePullPolicy: Always
          env:
            # The Service named "wger" creates a WGER_PORT service-link
            # variable. An explicit value takes precedence over that URL.
            - name: WGER_PORT
              value: "8000"
          envFrom:
            - configMapRef:
                name: wger-config
            - secretRef:
                name: wger-secrets
            - secretRef:
                name: wger-email
                optional: true
          ports:
            - name: django
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /api/v2/
              port: django
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v2/
              port: django
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v2/
              port: django
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 640Mi
          volumeMounts:
            - name: static
              mountPath: /home/wger/static
            - name: media
              mountPath: /home/wger/media
        - name: nginx
          image: docker.io/nginx:1.31.6-alpine
          ports:
            - name: http
              containerPort: 80
          startupProbe:
            httpGet:
              path: /api/v2/
              port: http
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v2/
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v2/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
            - name: static
              mountPath: /wger/static
              readOnly: true
            - name: media
              mountPath: /wger/media
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: wger-config
        - name: static
          persistentVolumeClaim:
            claimName: wger-static
        - name: media
          persistentVolumeClaim:
            claimName: wger-media
