apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: alloy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.15.0
    helm:
      values: |
        alloy:
          # otelcol.processor.deltatocumulative is experimental in Alloy.
          stabilityLevel: experimental
          configMap:
            content: |
              // Discover Kubernetes pods
              discovery.kubernetes "pods" {
                role = "pod"
              }

              // Relabel discovered pods
              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  target_label  = "app"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  target_label  = "node"
                }
              }

              // Collect logs from pods
              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pods.output
                forward_to = [loki.process.json_logs.receiver]
              }

              // Parse JSON logs and extract level
              loki.process "json_logs" {
                stage.json {
                  expressions = {
                    level_raw = "level",
                    severity  = "severity",
                  }
                }

                // Map pino numeric levels to strings
                stage.template {
                  source   = "level_label"
                  template = "{{`{{ if .severity }}{{ .severity }}{{ else if eq .level_raw \"10\" }}trace{{ else if eq .level_raw \"20\" }}debug{{ else if eq .level_raw \"30\" }}info{{ else if eq .level_raw \"40\" }}warn{{ else if eq .level_raw \"50\" }}error{{ else if eq .level_raw \"60\" }}fatal{{ else if .level_raw }}{{ .level_raw }}{{ else }}unknown{{ end }}`}}"
                }

                stage.labels {
                  values = {
                    level = "level_label",
                  }
                }

                forward_to = [loki.write.default.receiver]
              }

              // Write logs to Loki
              loki.write "default" {
                endpoint {
                  url = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
                }
              }

              // Receive OTLP data from applications
              otelcol.receiver.otlp "default" {
                http {
                  endpoint = "0.0.0.0:4318"
                }
                output {
                  metrics = [otelcol.processor.memory_limiter.default.input]
                  traces  = [otelcol.processor.memory_limiter.default.input]
                  logs    = [otelcol.processor.memory_limiter.default.input]
                }
              }

              // Refuses OTLP data once the heap passes limit - spike_limit
              // (240MiB of the 384Mi container limit). The receiver then answers
              // with a retryable error, so Hestia's and tpad's queues resend.
              // No batch processor: it acknowledges before exporting and drops
              // what the exporters refuse, so the senders would not retry.
              otelcol.processor.memory_limiter "default" {
                check_interval = "1s"
                limit          = "300MiB"
                spike_limit    = "60MiB"
                output {
                  metrics = [otelcol.processor.transform.codex_host.input]
                  traces  = [otelcol.exporter.otlp.tempo.input]
                  logs    = [otelcol.exporter.loki.default.input]
                }
              }

              // Codex tags metrics with the host only as the resource attribute env
              // (its otel environment), which the Prometheus exporter drops, so
              // Hestia's and tpad's series would collide.
              // Claude Code already sets host.name on each point.
              otelcol.processor.transform "codex_host" {
                error_mode = "ignore"
                metric_statements {
                  context    = "datapoint"
                  statements = [
                    `set(attributes["host.name"], resource.attributes["env"]) where IsMatch(resource.attributes["service.name"], "^codex")`,
                  ]
                }
                output {
                  metrics = [otelcol.processor.deltatocumulative.default.input]
                }
              }

              // Forward traces to Tempo
              otelcol.exporter.otlp "tempo" {
                client {
                  endpoint = "tempo.tempo.svc.cluster.local:4317"
                  tls {
                    insecure = true
                  }
                }
              }

              // Convert OTLP logs to Loki format
              otelcol.exporter.loki "default" {
                forward_to = [loki.write.default.receiver]
              }

              // Claude Code and Codex send delta sums and histograms, which the
              // Prometheus exporter drops. Cumulative metrics pass through as is.
              otelcol.processor.deltatocumulative "default" {
                // Bounds memory; idle streams also expire after 5m (max_stale).
                max_streams = 10000
                output {
                  metrics = [otelcol.exporter.prometheus.default.input]
                }
              }

              // Forward OTLP metrics (hestia host and agent metrics) to Prometheus
              otelcol.exporter.prometheus "default" {
                forward_to = [prometheus.remote_write.default.receiver]
              }

              prometheus.remote_write "default" {
                endpoint {
                  url = "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
                }
              }
          extraPorts:
            - name: otlp-http
              port: 4318
              targetPort: 4318
              protocol: TCP
          resources:
            requests:
              memory: 192Mi
            limits:
              # Headroom for the remote_write WAL and the agent OTLP from Hestia
              # and tpad; the working set reached 181Mi in November 2026.
              memory: 384Mi

        controller:
          type: daemonset

        # OTLP from hestia, reachable only on k8s-server's tailnet address.
        extraObjects:
          - apiVersion: v1
            kind: Service
            metadata:
              name: alloy-tailnet
              namespace: alloy
            spec:
              selector:
                app.kubernetes.io/instance: alloy
                app.kubernetes.io/name: alloy
              externalIPs:
                - 100.64.0.1
              ports:
                - name: otlp-http
                  port: 4318
                  targetPort: 4318
                  protocol: TCP
  destination:
    server: https://kubernetes.default.svc
    namespace: alloy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
