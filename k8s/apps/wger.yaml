apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: wger
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MikaelSiidorow/systems.git
    targetRevision: main
    path: k8s/wger
  destination:
    server: https://kubernetes.default.svc
    namespace: wger
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
