apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.0.0
    helm:
      values: |
        grafana:
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - grafana.miksu.app
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-dns
            tls:
              - secretName: grafana-tls
                hosts:
                  - grafana.miksu.app
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          persistence:
            enabled: false
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 384Mi
          additionalDataSources:
            - name: Loki
              type: loki
              url: http://loki.loki.svc.cluster.local:3100
              access: proxy
              isDefault: false
              jsonData:
                derivedFields:
                  - name: TraceID
                    matcherRegex: '"trace_id":"(\w+)"'
                    url: '$${__value.raw}'
                    datasourceUid: tempo
                    matcherType: regex
            - name: Tempo
              type: tempo
              uid: tempo
              url: http://tempo.tempo.svc.cluster.local:3200
              access: proxy
              isDefault: false
              jsonData:
                tracesToLogsV2:
                  datasourceUid: loki
                  filterByTraceID: false
                  filterBySpanID: false
                tracesToMetrics:
                  datasourceUid: prometheus
                nodeGraph:
                  enabled: true
                serviceMap:
                  datasourceUid: prometheus

        prometheus:
          prometheusSpec:
            enableRemoteWriteReceiver: true
            scrapeInterval: 60s
            retention: 7d
            resources:
              requests:
                memory: 512Mi
              limits:
                memory: 1Gi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  resources:
                    requests:
                      storage: 10Gi

        alertmanager:
          alertmanagerSpec:
            secrets:
              - alertmanager-telegram-token
            resources:
              requests:
                memory: 32Mi
              limits:
                memory: 64Mi
          config:
            global:
              resolve_timeout: 5m
            route:
              receiver: telegram
              group_by: ['alertname', 'namespace']
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              routes:
                - receiver: 'null'
                  matchers:
                    - alertname = "Watchdog"
                - receiver: 'null'
                  matchers:
                    - alertname = "InfoInhibitor"
            receivers:
              - name: 'null'
              - name: telegram
                telegram_configs:
                  - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram-token/bot-token
                    chat_id: -1003049249814
                    parse_mode: HTML
                    message: |-
                      {{ range .Alerts }}
                      {{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} <b>{{ .Labels.alertname }}</b>
                      <b>Severity:</b> {{ .Labels.severity }}
                      <b>Namespace:</b> {{ .Labels.namespace }}
                      {{ if .Annotations.description }}{{ .Annotations.description }}{{ else }}{{ .Annotations.summary }}{{ end }}
                      {{ end }}
            inhibit_rules:
              - source_matchers:
                  - severity = "critical"
                target_matchers:
                  - severity = "warning"
                equal: ['alertname', 'namespace']

        # Slow failures the default rules miss: a container that sits at its memory
        # limit thrashes on page faults, and restarts spread over hours never
        # trip KubePodCrashLooping.
        additionalPrometheusRulesMap:
          container-health:
            groups:
              - name: container-health
                rules:
                  - alert: ContainerMemoryNearLimit
                    expr: |
                      max by (namespace, pod, container) (container_memory_working_set_bytes{container!="", image!=""})
                        / on (namespace, pod, container)
                      max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"})
                        > 0.9
                    for: 30m
                    labels:
                      severity: warning
                    annotations:
                      summary: Container is close to its memory limit.
                      description: '{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} has used {{ $value | humanizePercentage }} of its memory limit for 30 minutes.'
                  - alert: ContainerRestartingOften
                    # increase() extrapolates (3 restarts read as ~3.02), so round before comparing.
                    # The 24h window keeps deleted pods' samples; only alert on live containers.
                    expr: |
                      round(increase(kube_pod_container_status_restarts_total[24h])) > 3
                        and on (namespace, pod, container) kube_pod_container_status_restarts_total
                    labels:
                      severity: warning
                    annotations:
                      summary: Container keeps restarting.
                      description: '{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} restarted {{ $value | humanize }} times in the last 24 hours.'

          hestia:
            groups:
              - name: hestia
                rules:
                  # Hestia pushes over OTLP, so silence means it froze or lost the tailnet.
                  - alert: HestiaDown
                    expr: absent_over_time(node_boot_time_seconds{instance="hestia"}[5m])
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: No metrics from hestia.
                      description: Hestia has sent no metrics for 10 minutes. It may be frozen or off the tailnet.
                  - alert: Zigbee2mqttDown
                    expr: node_systemd_unit_state{instance="hestia", name="zigbee2mqtt.service", state="active"} == 0
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: zigbee2mqtt is not running on hestia.
                      description: zigbee2mqtt.service on hestia has not been active for 10 minutes.

        prometheusOperator:
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi

        prometheus-node-exporter:
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 64Mi

        kube-state-metrics:
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 64Mi

        kubeEtcd:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeProxy:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
