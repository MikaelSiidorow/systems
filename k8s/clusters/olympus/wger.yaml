apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wger
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  # Waits for the bootstrap and PowerSync setup Jobs, and wger-web's
  # migrations on a fresh database.
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/wger
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  prune: true
  # Data survives its removal from Git: Flux never prunes a volume claim or a
  # CRD, and deleting this Kustomization leaves what it applied.
  deletionPolicy: Orphan
  patches:
    - target:
        kind: PersistentVolumeClaim|CustomResourceDefinition
      patch: |
        apiVersion: v1
        kind: Any
        metadata:
          name: any
          annotations:
            kustomize.toolkit.fluxcd.io/prune: disabled
  wait: true
