# Temporary check that Flux decrypts our post-quantum age keys on olympus.
# Removed once the first real app moves to Flux.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sops-canary
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/sops-canary
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  prune: true
  deletionPolicy: Delete
  wait: true
