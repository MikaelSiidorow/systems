apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wger-ingress
  namespace: flux-system
spec:
  # wger ships a known admin password; its bootstrap Job replaces it. The
  # public Ingress waits until that Job has completed.
  dependsOn:
    - name: wger
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/wger-ingress
  prune: true
  # Data survives its removal from Git: Flux never prunes a volume claim or a
  # CRD, and deleting this Kustomization leaves what it applied.
  deletionPolicy: Orphan
  patches:
    - target:
        kind: PersistentVolumeClaim|CustomResourceDefinition
      patch: |
        apiVersion: v1
        kind: Any
        metadata:
          name: any
          annotations:
            kustomize.toolkit.fluxcd.io/prune: disabled
  wait: true
