# The cluster's shared controllers, then their configuration. Every app
# depends on infrastructure-configs, so it is applied once ingress, TLS and
# their CRDs are in place. See docs/adr/0001-nixos-bootstraps-only-flux.md.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-controllers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/infrastructure/controllers
  prune: true
  # Data survives its removal from Git: Flux never prunes a volume claim or a
  # CRD, and deleting this Kustomization leaves what it applied.
  deletionPolicy: Orphan
  patches:
    - target:
        kind: PersistentVolumeClaim|CustomResourceDefinition
      patch: |
        apiVersion: v1
        kind: Any
        metadata:
          name: any
          annotations:
            kustomize.toolkit.fluxcd.io/prune: disabled
  # Waiting on everything here would count a chart repository's index outage
  # as a failure and hold back every app, so only the controllers' releases
  # are health-checked.
  wait: false
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: traefik
      namespace: flux-system
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-controllers
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/infrastructure/configs
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  prune: true
  # Data survives its removal from Git: Flux never prunes a volume claim or a
  # CRD, and deleting this Kustomization leaves what it applied.
  deletionPolicy: Orphan
  patches:
    - target:
        kind: PersistentVolumeClaim|CustomResourceDefinition
      patch: |
        apiVersion: v1
        kind: Any
        metadata:
          name: any
          annotations:
            kustomize.toolkit.fluxcd.io/prune: disabled
  # Apps need the issuers to exist, not to be Ready: an ACME outage during a
  # re-registration shouldn't hold back every app. Applying already fails if
  # cert-manager's CRDs are missing.
  wait: false
