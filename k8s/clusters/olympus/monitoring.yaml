apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  # kube-prometheus-stack can take a while to roll out.
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/monitoring
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  prune: true
  # Data survives its removal from Git: Flux never prunes a volume claim or a
  # CRD, and deleting this Kustomization leaves what it applied.
  deletionPolicy: Orphan
  patches:
    - target:
        kind: PersistentVolumeClaim|CustomResourceDefinition
      patch: |
        apiVersion: v1
        kind: Any
        metadata:
          name: any
          annotations:
            kustomize.toolkit.fluxcd.io/prune: disabled
  wait: true
