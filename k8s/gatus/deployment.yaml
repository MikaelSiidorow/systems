apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: gatus
  annotations:
    # Allow Flux to recreate the Deployment when an SSA dry-run returns Invalid
    # (needed to switch the live RollingUpdate Deployment to Recreate).
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gatus
  template:
    metadata:
      annotations:
        checksum/config: fc070d90ef7dff70
      labels:
        app: gatus
        app.kubernetes.io/name: gatus
        app.kubernetes.io/component: status-page
    spec:
      containers:
        - name: gatus
          image: twinproduction/gatus:v5.38.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 64Mi
              cpu: 25m
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          env:
            - name: GATUS_CONFIG_PATH
              value: /config/config.yaml
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gatus-telegram-token
                  key: bot-token
      volumes:
        - name: config
          configMap:
            name: gatus-config
        - name: data
          persistentVolumeClaim:
            claimName: gatus-data
