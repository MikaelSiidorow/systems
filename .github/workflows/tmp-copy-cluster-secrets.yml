# Temporary: copies the live cluster Secrets that tofu/k8s manages into SOPS
# files for Flux, so nobody handles plaintext. Never merged.
name: Copy cluster secrets to SOPS (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  K3S_HOST: ${{ vars.K3S_HOST }}
  K3S_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIrMag55gL+LvDK1fssChh6eKk1ayS9fBNwbvqPh48da
jobs:
  copy:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'tmp/copy-cluster-secrets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install sops
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: .github/scripts/ci-secrets.sh
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.K3S_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$K3S_HOST $K3S_HOST_KEY" >> ~/.ssh/known_hosts
      - name: Encrypt cluster Secrets to SOPS
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/sops-out"
          mkdir -p "$out"
          # Usage: copy <namespace> <name> <repo path>
          # Plaintext exists only in the pipe; .sops.yaml picks the PQ recipients
          # and encrypted_regex from the target path.
          copy() {
            local ns=$1 name=$2 path=$3
            if ! ssh "root@$K3S_HOST" k3s kubectl -n "$ns" get secret "$name" -o name >/dev/null 2>&1; then
              echo "$ns/$name: not in the cluster, skipped"
              return
            fi
            ssh "root@$K3S_HOST" k3s kubectl -n "$ns" get secret "$name" -o json |
              jq '{apiVersion: "v1", kind: "Secret",
                   metadata: {name: .metadata.name, namespace: .metadata.namespace},
                   type: .type, data: .data}' |
              "$RUNNER_TEMP/sops" encrypt --input-type json --output-type yaml \
                --filename-override "$path" /dev/stdin >"$out/$(basename "$path")"
            echo "$ns/$name -> $path: keys $(yq -r '.data | keys | join(",")' "$out/$(basename "$path")"), $(grep -c 'ENC\[' "$out/$(basename "$path")") encrypted values, $(grep -c 'recipient:' "$out/$(basename "$path")") recipients"
          }
          copy refinery refinery-secrets k8s/refinery/refinery-secrets.sops.yaml
          copy monitoring grafana-admin k8s/monitoring/grafana-admin.sops.yaml
          copy monitoring alertmanager-telegram-token k8s/monitoring/alertmanager-telegram-token.sops.yaml
          copy cert-manager cloudflare-api-token k8s/cert-manager/cloudflare-api-token.sops.yaml
          copy wger wger-secrets k8s/wger/wger-secrets.sops.yaml
          copy wger wger-admin-bootstrap k8s/wger/wger-admin-bootstrap.sops.yaml
          copy wger wger-email k8s/wger/wger-email.sops.yaml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cluster-secrets-sops
          path: ${{ runner.temp }}/sops-out/
