name: CI

# The single entry point for pull requests. Branch rules require only the
# CI Summary job below, so which checks gate a merge is decided here.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  # deploy.yml's nix-cache job asks for this on pushes to main; a called
  # workflow cannot be granted more than its caller.
  actions: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Posts a "running" placeholder; the report job replaces it with results.
  report-start:
    runs-on: ubuntu-latest
    # Fork PRs get a read-only token and cannot comment.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const { start } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/ci-report.ts`);
            await start({ github, context });

  changes:
    runs-on: ubuntu-latest
    outputs:
      workstations: ${{ steps.filter.outputs.workstations }}
      k8s: ${{ steps.filter.outputs.k8s }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            workstations:
              - 'workstations/**'
              - 'modules/**'
              - '.github/workflows/workstations.yml'
              - '.github/workflows/ci.yml'
            k8s:
              - 'k8s/**'
              - '.github/scripts/k8s-*.sh'
              - 'infra/nixos/hosts/k8s-server/*-helmchart.yaml'
              - '.github/workflows/ci.yml'
              - 'infra/flake.nix'
              - 'infra/flake.lock'
              - 'Makefile'

  workstations:
    needs: changes
    if: needs.changes.outputs.workstations == 'true'
    uses: ./.github/workflows/workstations.yml

  # Renders every Argo CD app and k3s HelmChart, validates them against the
  # Kubernetes and CRD schemas, so k8s/** PRs (including Renovate auto-merges)
  # have a real check, and reports the rendered diff against the base.
  k8s:
    needs: changes
    if: needs.changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@ef2850366b5ded57dc77cad10392197c5ce70343
        with:
          nix_conf: |
            experimental-features = nix-command flakes
      - name: Check manifests
        id: check
        run: nix develop ./infra -c make k8s-check
        continue-on-error: true
      - name: Diff rendered manifests
        id: diff
        run: |
          mkdir "$RUNNER_TEMP/base" "$RUNNER_TEMP/pr"
          nix develop ./infra -c .github/scripts/k8s-render.sh "$RUNNER_TEMP/pr"
          # The PR's script and tools render the base too, so only the
          # manifests differ.
          (cd base && nix develop ../infra -c ../.github/scripts/k8s-render.sh "$RUNNER_TEMP/base")
          cd "$RUNNER_TEMP"
          diff -ruN base pr >k8s.diff || [ $? = 1 ]
          # The report comment truncates long diffs.
          cat k8s.diff
        continue-on-error: true
      - name: Write CI report section
        if: always()
        env:
          CHECK: ${{ steps.check.outcome }}
          DIFF: ${{ steps.diff.outcome }}
        run: |
          diff="$RUNNER_TEMP/k8s.diff"
          if [ "$DIFF" = success ]; then
            n=$(grep -c '^diff ' "$diff" || true)
          fi
          if [ "$CHECK" != success ]; then
            status=failure
            summary="schema or format check failed"
          elif [ "$DIFF" != success ]; then
            status=success
            summary="valid; rendered diff unavailable"
          elif [ "$n" = 0 ]; then
            status=success
            summary="valid; no rendered changes"
          else
            status=changes
            [ "$n" = 1 ] && noun=app || noun=apps
            summary="valid; $n rendered $noun change"
          fi
          details=
          if [ "${n:-0}" != 0 ]; then
            details="$RUNNER_TEMP/details.md"
            # A fence no rendered manifest line can close early.
            fence='``````````'
            {
              echo "${fence}diff"
              cat "$diff"
              echo "$fence"
            } >"$details"
          fi
          .github/scripts/report-section.sh k8s 15 "k8s manifests" "$status" "$summary" ${details:+"$details"}
      - name: Upload CI report section
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-report-k8s
          path: ${{ runner.temp }}/report/k8s.json
      - name: Fail on check error
        if: steps.check.outcome == 'failure'
        run: exit 1

  infra:
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  summary:
    name: CI Summary
    needs: [changes, workstations, k8s, infra]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*)
              echo "❌ CI failed. Check the logs above."
              exit 1
              ;;
          esac
          echo "✅ All CI checks passed!"

  # One comment for the whole run, rebuilt from the sections that the checks
  # upload as pr-report-* artifacts. Not part of CI Summary.
  report:
    name: CI report
    needs: [report-start, changes, workstations, k8s, infra]
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: pr-report-*
          merge-multiple: true
          path: report
      - uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          WORKSTATIONS_RESULT: ${{ needs.workstations.result }}
          K8S_RESULT: ${{ needs.k8s.result }}
          INFRA_RESULT: ${{ needs.infra.result }}
        with:
          script: |
            const { finish } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/ci-report.ts`);
            await finish({ github, context }, {
              dir: 'report',
              results: {
                workstations: process.env.WORKSTATIONS_RESULT,
                k8s: process.env.K8S_RESULT,
                infra: process.env.INFRA_RESULT,
              },
            });
