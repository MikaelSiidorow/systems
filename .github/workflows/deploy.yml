name: Deploy
on:
  workflow_dispatch:
    inputs:
      component:
        description: "Component to deploy"
        required: true
        type: choice
        options:
          - all
          - nixos
          - k8s-tofu
          - tofu
  # Pull requests run this through ci.yml, which owns the required CI Summary;
  # the changes job below picks which checks apply.
  workflow_call:
  push:
    branches: [main]
    paths:
      - "infra/nixos/**"
      - ".sops.yaml"
      - "infra/flake.nix"
      - "infra/flake.lock"
      - "infra/secrets/olympus.yaml"
      - "tofu/**"
      - "infra/secrets/ci.yaml"
      - ".github/scripts/ci-secrets.sh"
      - ".github/workflows/deploy.yml"
      - ".github/scripts/reconcile-wger.sh"
      # Argo CD deploys these; the smoke job checks the result.
      - "k8s/**"
      - ".github/scripts/smoke.sh"
permissions:
  contents: read
  pull-requests: write
env:
  K3S_HOST: ${{ vars.K3S_HOST }}
  # olympus's SSH host key, pinned so the jobs only talk to the real server.
  # A rebuilt server has a new one; see docs/deploying.md.
  K3S_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIrMag55gL+LvDK1fssChh6eKk1ayS9fBNwbvqPh48da
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      nixos: ${{ steps.filter.outputs.nixos }}
      openwrt: ${{ steps.filter.outputs.openwrt }}
      tofu: ${{ steps.filter.outputs.tofu }}
      k8s_tofu: ${{ steps.filter.outputs.k8s_tofu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            nixos:
              - 'infra/nixos/**'
              - 'infra/flake.nix'
              - 'infra/flake.lock'
              - 'infra/secrets/olympus.yaml'
              - '.github/workflows/deploy.yml'
            # Router changes only; OpenWrt has its own flake and lock, updated
            # daily because OpenWrt republishes package indexes often.
            openwrt:
              - 'openwrt/**'
            tofu:
              # Top-level files only; tofu/k8s/ is k8s_tofu. A '!' entry
              # would match every other path, since the patterns are OR'd.
              - 'tofu/*'
              - 'infra/secrets/ci.yaml'
              - '.github/scripts/ci-secrets.sh'
              - '.github/workflows/deploy.yml'
            k8s_tofu:
              - 'tofu/k8s/**'
              - 'tofu/mail.tf'
              - 'tofu/outputs.tf'
              - 'infra/secrets/ci.yaml'
              # A rotation changes this file and the matching Actions secret.
              - 'infra/secrets/olympus.yaml'
              - '.github/scripts/ci-secrets.sh'
              - '.github/workflows/deploy.yml'
              - '.github/scripts/reconcile-wger.sh'
  nixos-preview:
    needs: changes
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.nixos == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # PR caches are only visible to the same PR; main saves the shared one.
          save: false
      - name: Build base config
        id: build-base
        run: |
          # Bases from before the flake moved into infra/ keep it at the root.
          base=./base/infra
          [ -f "$base/flake.nix" ] || base=./base
          nix build "$base#nixosConfigurations.olympus.config.system.build.toplevel" -o result-base
        continue-on-error: true
      - name: Build PR config
        id: build-pr
        run: nix build ./pr/infra#nixosConfigurations.olympus.config.system.build.toplevel -o result-pr
        continue-on-error: true
      - name: Evaluate PR deploy config
        id: check-pr
        run: nix eval --json ./pr/infra#deploy > /dev/null
        continue-on-error: true
      - name: Evaluate PR Hestia config
        id: build-hestia
        run: nix eval --raw ./pr/infra#nixosConfigurations.hestia.config.system.build.toplevel.drvPath
        continue-on-error: true
      - name: Diff closures
        id: diff
        if: steps.build-base.outcome == 'success' && steps.build-pr.outcome == 'success'
        run: |
          # The auto-merge below trusts the diff only when it succeeded.
          if output=$(nix store diff-closures ./result-base ./result-pr 2>&1); then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$output" ]; then
            output="No changes detected."
          fi
          {
            echo "diff<<EOF"
            echo "$output"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        continue-on-error: true
      - name: Write CI report section
        if: always()
        env:
          BUILD_BASE: ${{ steps.build-base.outcome }}
          BUILD_PR: ${{ steps.build-pr.outcome }}
          CHECK_PR: ${{ steps.check-pr.outcome }}
          BUILD_HESTIA: ${{ steps.build-hestia.outcome }}
          DIFF: ${{ steps.diff.outputs.diff }}
        run: |
          mark() { [ "$1" = success ] && echo ✅ || echo ❌; }
          status=success
          for outcome in "$BUILD_BASE" "$BUILD_PR" "$CHECK_PR" "$BUILD_HESTIA"; do
            [ "$outcome" = success ] || status=failure
          done
          if [ "$status" = failure ]; then
            summary="build or evaluation failed"
          elif [ "$DIFF" = "No changes detected." ]; then
            summary="no olympus closure changes; Hestia evaluates"
          else
            status=changes
            n=$(printf '%s\n' "$DIFF" | grep -c .)
            [ "$n" = 1 ] && noun=change || noun=changes
            summary="$n olympus closure $noun; Hestia evaluates"
          fi
          {
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Build olympus (base) | $(mark "$BUILD_BASE") |"
            echo "| Build olympus (PR) | $(mark "$BUILD_PR") |"
            echo "| Evaluate deploy config | $(mark "$CHECK_PR") |"
            echo "| Evaluate Hestia | $(mark "$BUILD_HESTIA") |"
            echo
            # Long enough that no closure diff line can close it early.
            echo '``````````'
            echo "${DIFF:-No closure diff available.}"
            echo '``````````'
          } >"$RUNNER_TEMP/details.md"
          pr/.github/scripts/report-section.sh nixos 20 "Olympus + Hestia" "$status" "$summary" "$RUNNER_TEMP/details.md"
      - name: Upload CI report section
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-report-nixos
          path: ${{ runner.temp }}/report/nixos.json
      - name: Fail on build error
        if: |
          steps.build-base.outcome == 'failure' ||
          steps.build-pr.outcome == 'failure' ||
          steps.check-pr.outcome == 'failure' ||
          steps.build-hestia.outcome == 'failure'
        run: exit 1
      # The weekly infra lock update merges itself once CI Summary passes,
      # unless it changes a version that needs a look at the release notes.
      # The smoke job checks olympus after the deploy; Hestia stays manual.
      - name: Create GitHub App token
        id: app-token
        if: >-
          github.event.pull_request.user.login == 'mikael-systems-bot[bot]' &&
          github.head_ref == 'update/infra-all' &&
          steps.diff.outputs.ok == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Enable auto-merge for a routine lock update
        if: steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DIFF: ${{ steps.diff.outputs.diff }}
        run: |
          files=$(gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --name-only)
          if grep -qvx 'infra/flake.lock' <<<"$files"; then
            echo "The PR changes more than infra/flake.lock; leaving it for review."
            exit 0
          fi
          # Lines look like "linux: 6.18.55 → 6.18.57, +76.1 KiB". Block new
          # k3s or kernel minors, PostgreSQL or systemd majors, and any of them
          # appearing or disappearing.
          blocked=$(printf '%s\n' "$DIFF" | sed 's/\x1b\[[0-9;]*m//g' | awk '
            function release(s, re) {
              return match(s, re) ? substr(s, RSTART, RLENGTH) : "none"
            }
            /^(k3s|linux|postgresql|systemd): / && / → / {
              re = /^(k3s|linux):/ ? "[0-9]+\\.[0-9]+" : "[0-9]+"
              split($0, side, " → ")
              sub(/^[^:]*: /, "", side[1])
              if (release(side[1], re) != release(side[2], re)) print
            }')
          if [ -n "$blocked" ]; then
            printf 'Leaving it for review because of:\n%s\n' "$blocked"
            exit 0
          fi
          gh pr merge --auto --squash "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
  # The committed Traefik CRDs must match the chart version pinned in
  # traefik-helmchart.yaml, e.g. after a manual chart bump. Renovate
  # regenerates them itself.
  traefik-crds:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.nixos == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the committed Traefik CRDs
        run: |
          file=infra/nixos/hosts/olympus/traefik-crds.yaml
          version=$(yq '.spec.version' infra/nixos/hosts/olympus/traefik-helmchart.yaml)
          .github/scripts/traefik-crds.sh "$version" "$RUNNER_TEMP/traefik-crds.yaml"
          if ! diff -q "$file" "$RUNNER_TEMP/traefik-crds.yaml" >/dev/null; then
            echo "::error file=$file::Out of date for traefik chart $version. Run: .github/scripts/traefik-crds.sh $version"
            exit 1
          fi
  nix-cache:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.nixos == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - name: Build olympus config
        run: nix build ./infra#nixosConfigurations.olympus.config.system.build.toplevel --no-link
  openwrt-check:
    needs: changes
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.openwrt == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Build router firmware and deployment tools
        id: build
        run: nix build ./openwrt#cerberus-firmware ./openwrt#hermes-firmware ./openwrt#cerberus-deploy ./openwrt#hermes-deploy --no-link
      - name: Write CI report section
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
        run: |
          if [ "$BUILD" = success ]; then
            status=success summary="cerberus + hermes firmware and deploy tools build"
          else
            status=failure summary="firmware or deploy tool build failed"
          fi
          .github/scripts/report-section.sh openwrt 30 "OpenWrt routers" "$status" "$summary"
      - name: Upload CI report section
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-report-openwrt
          path: ${{ runner.temp }}/report/openwrt.json
  tofu:
    needs: changes
    # Dependabot PRs only get Dependabot secrets, so their plans cannot reach
    # the cloud providers; an action version bump cannot change a plan anyway.
    if: |
      (github.event_name == 'pull_request' && needs.changes.outputs.tofu == 'true' &&
        github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'push' && needs.changes.outputs.tofu == 'true') ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["tofu", "all"]'), github.event.inputs.component))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tofu
    # Provider tokens and the R2 state credentials come from "Load CI secrets".
    env:
      SCW_ACCESS_KEY: ${{ vars.SCW_ACCESS_KEY }}
      TF_VAR_scaleway_organization_id: ${{ vars.SCW_ORGANIZATION_ID }}
      TF_VAR_scaleway_project_id: ${{ vars.SCW_PROJECT_ID }}
      TF_VAR_scaleway_billing_alert_email: ${{ vars.SCW_BILLING_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ~1.13
      - name: Load CI secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: '"$GITHUB_WORKSPACE/.github/scripts/ci-secrets.sh"'
      - name: Tofu Format Check
        id: fmt
        run: tofu fmt -check -recursive
        continue-on-error: true
      - name: Tofu Init
        id: init
        run: tofu init
      - name: Tofu Validate
        id: validate
        run: tofu validate -no-color
      - name: Tofu Plan
        id: plan
        run: tofu plan -no-color -lock-timeout=10m -out=tfplan
        continue-on-error: true
      - name: Check for infrastructure changes
        id: plan-changes
        if: github.event_name == 'pull_request' && steps.plan.outcome == 'success'
        run: |
          if tofu show -json tfplan | jq -e '
            ([.resource_changes[]? | select(.change.actions != ["no-op"])] | length == 0) and
            ([(.output_changes // {})[] | select(.actions != ["no-op"])] | length == 0)' >/dev/null; then
            echo "none=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Write CI report section
        if: always() && github.event_name == 'pull_request'
        env:
          FMT: ${{ steps.fmt.outcome }}
          INIT: ${{ steps.init.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          PLAN: ${{ steps.plan.outcome }}
          PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}
          NO_CHANGES: ${{ steps.plan-changes.outputs.none }}
        run: |
          mark() { case "$1" in success) echo ✅ ;; skipped | "") echo ⏭️ ;; *) echo ❌ ;; esac; }
          if [ "$INIT" != success ] || [ "$VALIDATE" != success ] || [ "$PLAN" != success ]; then
            status=failure summary="init, validate or plan failed"
          elif [ "$FMT" != success ]; then
            status=failure summary="tofu fmt found unformatted files"
          elif [ "$NO_CHANGES" = true ]; then
            status=success summary="no changes"
          else
            status=changes
            summary=$(printf '%s\n' "$PLAN_OUTPUT" | grep -oE '[0-9]+ to add, [0-9]+ to change, [0-9]+ to destroy' | head -1)
            summary=${summary:-changes}
          fi
          {
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Format | $(mark "$FMT") |"
            echo "| Init | $(mark "$INIT") |"
            echo "| Validate | $(mark "$VALIDATE") |"
            echo "| Plan | $(mark "$PLAN") |"
            echo
            # Long enough that no plan line can close it early.
            echo '``````````terraform'
            echo "${PLAN_OUTPUT:-No plan output.}"
            echo '``````````'
          } >"$RUNNER_TEMP/details.md"
          "$GITHUB_WORKSPACE/.github/scripts/report-section.sh" tofu 40 "OpenTofu" "$status" "$summary" "$RUNNER_TEMP/details.md"
      - name: Upload CI report section
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-report-tofu
          path: ${{ runner.temp }}/report/tofu.json
      - name: Fail on format or plan error
        if: steps.fmt.outcome == 'failure' || steps.plan.outcome == 'failure'
        run: exit 1
      # Renovate updates that change no infrastructure merge themselves once
      # CI Summary passes. The app token makes that merge trigger the deploy.
      - name: Create GitHub App token
        id: app-token
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'mikael-systems-bot[bot]' &&
          steps.plan-changes.outputs.none == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Enable auto-merge for a no-op update
        if: steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Only when every changed file belongs to this OpenTofu root.
          files=$(gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --name-only)
          if grep -qvE '^tofu/[^/]+$' <<<"$files"; then
            echo "The PR changes files outside this OpenTofu root; leaving it for review."
            exit 0
          fi
          gh pr merge --auto --squash "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
      - name: Tofu Apply
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: tofu apply -auto-approve -lock-timeout=10m tfplan
  nixos:
    needs: [changes, tofu, nix-cache]
    # nix-cache only warms the store: when it fails, this job still builds, so
    # a broken config fails here and holds back k8s-tofu.
    if: |
      always() &&
      (needs.tofu.result == 'success' || needs.tofu.result == 'skipped') &&
      ((github.event_name == 'push' && needs.changes.outputs.nixos == 'true') ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["nixos", "all"]'), github.event.inputs.component)))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes
      # The store nix-cache saved holds the same inputs, so the build below
      # mostly reuses it. The toplevel embeds the commit, so a store from another
      # commit rebuilds it.
      - name: Restore Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false
      # olympus has too little memory to build its own system: compiling
      # sops-install-secrets there on 2026-11-23 thrashed it for 25 minutes.
      - name: Build olympus config
        id: build
        run: |
          system=$(nix build ./infra#nixosConfigurations.olympus.config.system.build.toplevel --no-link --print-out-paths)
          echo "system=$system" >> "$GITHUB_OUTPUT"
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.K3S_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$K3S_HOST $K3S_HOST_KEY" >> ~/.ssh/known_hosts
      # olympus fetches what it can from its own caches and takes the rest,
      # such as sops-install-secrets, from here. A GC root keeps the copy alive
      # while the deploy below waits for the lock, and the last step removes it.
      # Should GC win the race before the root exists, realising it fails here.
      # CI's own builds are unsigned; olympus accepts them because root is a
      # trusted user there.
      - name: Copy config to olympus
        id: copy
        env:
          NIX_SSHOPTS: -o ServerAliveInterval=30
          SYSTEM: ${{ steps.build.outputs.system }}
        run: |
          nix copy --to "ssh-ng://root@$K3S_HOST" --substitute-on-destination --no-check-sigs "$SYSTEM"
          ssh "root@$K3S_HOST" mkdir -p /nix/var/nix/gcroots/ci-deploy '&&' \
            nix-store --realise "$SYSTEM" --add-root "/nix/var/nix/gcroots/ci-deploy/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" '>' /dev/null
      # Two switches at once fail on a transient systemd unit, so runs queue on a
      # lock on the host. Runs on main must not roll back a newer main deploy:
      # the host records the last commit it started deploying from main, and the
      # last one that switched successfully. Using GitHub's compare API, it skips
      # a commit that is behind the started one, but only succeeds once that
      # newer commit has switched; until then k8s-tofu must not run. Re-runs of
      # the same commit deploy again. A manual dispatch of another branch always
      # deploys and clears the switched record, so older main runs fail until a
      # main run switches again. If main is ever rewritten, let queued runs
      # finish, then delete /var/lib/nixos-deploy on olympus.
      # systemd-run, as nixos-rebuild does, lets the switch finish if SSH drops.
      - name: Deploy NixOS
        env:
          SYSTEM: ${{ steps.build.outputs.system }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          ssh -o ServerAliveInterval=30 "root@$K3S_HOST" flock -w 1800 /run/nixos-deploy.lock bash -s -- \
            "$SYSTEM" "$GITHUB_SHA" "$ON_MAIN" "$GITHUB_REPOSITORY" <<'EOF'
          set -euo pipefail
          system=$1 rev=$2 on_main=$3 repo=$4
          started=/var/lib/nixos-deploy/main-started
          switched=/var/lib/nixos-deploy/main-switched
          record() {
            mkdir -p "$(dirname "$1")"
            echo "$2" > "$1.tmp"
            mv "$1.tmp" "$1"
          }
          if [ "$on_main" = true ] && [ -f "$started" ]; then
            last=$(cat "$started")
            if [ "$last" != "$rev" ]; then
              if ! status=$(curl -fsS --max-time 20 --retry 3 --retry-max-time 60 \
                "https://api.github.com/repos/$repo/compare/$last...$rev" | jq -er .status); then
                echo "Could not ask GitHub how $rev relates to the last deploy, $last; re-run later." >&2
                exit 1
              fi
              case $status in
                ahead) ;;
                behind)
                  # Also check olympus still runs it, not a rollback or a branch.
                  if [ "$(cat "$switched" 2>/dev/null)" != "$last $(readlink -f /run/current-system)" ]; then
                    echo "olympus is not running the newer $last as switched by its deploy; fix or re-run that deploy." >&2
                    exit 1
                  fi
                  echo "olympus already runs the newer $last; skipping $rev. If main was force-pushed back to $rev, delete /var/lib/nixos-deploy on olympus and re-run."
                  exit 0
                  ;;
                *)
                  echo "$rev is $status relative to the last deploy, $last. If main was rewritten, delete /var/lib/nixos-deploy on olympus and re-run." >&2
                  exit 1
                  ;;
              esac
            fi
          fi
          test -x "$system/bin/switch-to-configuration"
          echo "Deploying $rev"
          # Recorded before switching, so a waiting older run never switches
          # over this one, even if this switch fails partway.
          # Cleared before any switch, so a failed one never counts as switched.
          rm -f "$switched"
          if [ "$on_main" = true ]; then record "$started" "$rev"; fi
          nix-env --profile /nix/var/nix/profiles/system --set "$system"
          systemd-run -E LOCALE_ARCHIVE -E NIXOS_INSTALL_BOOTLOADER --collect --no-ask-password \
            --pipe --quiet --service-type=exec --unit=nixos-rebuild-switch-to-configuration \
            "$system/bin/switch-to-configuration" switch
          if [ "$on_main" = true ]; then record "$switched" "$rev $system"; fi
          # The public half of the host's age key, for .sops.yaml.
          recipient=$(age-keygen -y /var/lib/sops-nix/key.txt)
          echo "SOPS recipient: $recipient"
          EOF
      - name: Remove the GC root
        if: always() && (steps.copy.outcome == 'success' || steps.copy.outcome == 'failure')
        run: ssh "root@$K3S_HOST" rm -f "/nix/var/nix/gcroots/ci-deploy/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
  k8s-tofu:
    needs: [changes, tofu, nixos]
    if: |
      always() &&
      (needs.tofu.result == 'success' || needs.tofu.result == 'skipped') &&
      (needs.nixos.result == 'success' || needs.nixos.result == 'skipped') &&
      ((github.event_name == 'pull_request' && needs.changes.outputs.k8s_tofu == 'true' &&
        github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'push' && needs.changes.outputs.k8s_tofu == 'true') ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["k8s-tofu", "all"]'), github.event.inputs.component)))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tofu/k8s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ~1.13
      - name: Load CI secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: '"$GITHUB_WORKSPACE/.github/scripts/ci-secrets.sh"'
      - name: Setup SSH and K8s access
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.K3S_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$K3S_HOST $K3S_HOST_KEY" >> ~/.ssh/known_hosts
          ssh -fN -L 6443:127.0.0.1:6443 root@${{ env.K3S_HOST }}
          ssh root@${{ env.K3S_HOST }} cat /etc/rancher/k3s/k3s.yaml > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
      - name: Ensure wger namespace exists
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          ssh root@${{ env.K3S_HOST }} \
            "k3s kubectl create namespace wger --dry-run=client -o yaml | k3s kubectl apply -f -"
      - name: Tofu Format Check
        id: fmt
        run: tofu fmt -check -recursive
        continue-on-error: true
      - name: Tofu Init
        id: init
        run: tofu init
      - name: Tofu Validate
        id: validate
        run: tofu validate -no-color
      - name: Tofu Plan
        id: plan
        run: tofu plan -no-color -lock-timeout=10m -out=tfplan
        continue-on-error: true
        env:
          KUBE_CONFIG_PATH: /tmp/kubeconfig
          TF_VAR_cloudflare_api_token: ${{ env.CLOUDFLARE_API_TOKEN }}
          TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          TF_VAR_wger_postgres_password: ${{ secrets.WGER_POSTGRES_PASSWORD }}
          TF_VAR_wger_powersync_password: ${{ secrets.WGER_POWERSYNC_PASSWORD }}
          TF_VAR_wger_secret_key: ${{ secrets.WGER_SECRET_KEY }}
          TF_VAR_wger_jwt_public_key: ${{ secrets.WGER_JWT_PUBLIC_KEY }}
          TF_VAR_wger_jwt_private_key: ${{ secrets.WGER_JWT_PRIVATE_KEY }}
      - name: Check for infrastructure changes
        id: plan-changes
        if: github.event_name == 'pull_request' && steps.plan.outcome == 'success'
        run: |
          if tofu show -json tfplan | jq -e '
            ([.resource_changes[]? | select(.change.actions != ["no-op"])] | length == 0) and
            ([(.output_changes // {})[] | select(.actions != ["no-op"])] | length == 0)' >/dev/null; then
            echo "none=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Detect Wger credential changes
        id: wger-changes
        if: steps.plan.outcome == 'success'
        run: |
          set -o pipefail
          changed="$(
            tofu show -json tfplan |
              jq -r '
                any(
                  .resource_changes[]?;
                  (
                    .address == "kubernetes_secret_v1.wger_secrets" or
                    (.address | startswith("kubernetes_secret_v1.wger_email"))
                  ) and .change.actions != ["no-op"]
                )
              '
          )"
          if [[ "$changed" != "true" && "$changed" != "false" ]]; then
            echo "Unexpected Wger change result: $changed" >&2
            exit 1
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Write CI report section
        if: always() && github.event_name == 'pull_request'
        env:
          FMT: ${{ steps.fmt.outcome }}
          INIT: ${{ steps.init.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          PLAN: ${{ steps.plan.outcome }}
          PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}
          NO_CHANGES: ${{ steps.plan-changes.outputs.none }}
          WGER_CHANGED: ${{ steps.wger-changes.outputs.changed }}
        run: |
          mark() { case "$1" in success) echo ✅ ;; skipped | "") echo ⏭️ ;; *) echo ❌ ;; esac; }
          if [ "$INIT" != success ] || [ "$VALIDATE" != success ] || [ "$PLAN" != success ]; then
            status=failure summary="init, validate or plan failed"
          elif [ "$FMT" != success ]; then
            status=failure summary="tofu fmt found unformatted files"
          elif [ "$NO_CHANGES" = true ]; then
            status=success summary="no changes"
          else
            status=changes
            summary=$(printf '%s\n' "$PLAN_OUTPUT" | grep -oE '[0-9]+ to add, [0-9]+ to change, [0-9]+ to destroy' | head -1)
            summary=${summary:-changes}
          fi
          if [ "$WGER_CHANGED" = true ]; then summary="$summary; wger credentials change"; fi
          {
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Format | $(mark "$FMT") |"
            echo "| Init | $(mark "$INIT") |"
            echo "| Validate | $(mark "$VALIDATE") |"
            echo "| Plan | $(mark "$PLAN") |"
            echo
            # Long enough that no plan line can close it early.
            echo '``````````terraform'
            echo "${PLAN_OUTPUT:-No plan output.}"
            echo '``````````'
          } >"$RUNNER_TEMP/details.md"
          "$GITHUB_WORKSPACE/.github/scripts/report-section.sh" k8s-tofu 50 "k8s OpenTofu" "$status" "$summary" "$RUNNER_TEMP/details.md"
      - name: Upload CI report section
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-report-k8s-tofu
          path: ${{ runner.temp }}/report/k8s-tofu.json
      - name: Fail on format or plan error
        if: steps.fmt.outcome == 'failure' || steps.plan.outcome == 'failure'
        run: exit 1
      # Renovate updates that change no infrastructure merge themselves once
      # CI Summary passes. The app token makes that merge trigger the deploy.
      - name: Create GitHub App token
        id: app-token
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'mikael-systems-bot[bot]' &&
          steps.plan-changes.outputs.none == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Enable auto-merge for a no-op update
        if: steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Only when every changed file belongs to this OpenTofu root.
          files=$(gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --name-only)
          if grep -qvE '^tofu/k8s/[^/]+$' <<<"$files"; then
            echo "The PR changes files outside this OpenTofu root; leaving it for review."
            exit 0
          fi
          gh pr merge --auto --squash "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
      - name: Tofu Apply
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          KUBE_CONFIG_PATH: /tmp/kubeconfig
          TF_VAR_cloudflare_api_token: ${{ env.CLOUDFLARE_API_TOKEN }}
          TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          TF_VAR_wger_postgres_password: ${{ secrets.WGER_POSTGRES_PASSWORD }}
          TF_VAR_wger_powersync_password: ${{ secrets.WGER_POWERSYNC_PASSWORD }}
          TF_VAR_wger_secret_key: ${{ secrets.WGER_SECRET_KEY }}
          TF_VAR_wger_jwt_public_key: ${{ secrets.WGER_JWT_PUBLIC_KEY }}
          TF_VAR_wger_jwt_private_key: ${{ secrets.WGER_JWT_PRIVATE_KEY }}
        run: tofu apply -auto-approve -lock-timeout=10m tfplan
      - name: Reconcile changed wger credentials
        if: |
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          steps.wger-changes.outputs.changed == 'true'
        run: ../../.github/scripts/reconcile-wger.sh "${{ env.K3S_HOST }}"
  smoke:
    needs: [tofu, nixos, k8s-tofu]
    # Failed or cancelled deploy jobs already fail the run.
    if: |
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Argo CD may already be on a newer commit; the script checks ancestry.
          fetch-depth: 0
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.K3S_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$K3S_HOST $K3S_HOST_KEY" >> ~/.ssh/known_hosts
      # A tag:ci node, which the Headscale ACL only lets reach olympus:443,
      # checks the tailnet-only hosts. Without the key they are only checked
      # to refuse the public address.
      - name: Check for the Headscale key
        id: key
        env:
          KEY: ${{ secrets.HEADSCALE_CI_AUTHKEY }}
        run: echo "present=${KEY:+true}" >> "$GITHUB_OUTPUT"
      - name: Connect to Headscale VPN
        id: tailnet
        if: steps.key.outputs.present == 'true'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          authkey: ${{ secrets.HEADSCALE_CI_AUTHKEY }}
          version: 1.96.4
          sha256sum: a1cba18826b1f91cb25ef7f5b8259b5258339b42db7867af9269e21829ea78cc
          use-cache: "false"
          args: --login-server=https://hs.miksu.app --accept-dns=false
      - name: Smoke test olympus
        env:
          TAILNET_IP: ${{ steps.tailnet.outcome == 'success' && '100.64.0.1' || '' }}
          NIXOS_DEPLOYED: ${{ needs.nixos.result == 'success' }}
        run: .github/scripts/smoke.sh "${{ env.K3S_HOST }}" "${{ github.sha }}"
