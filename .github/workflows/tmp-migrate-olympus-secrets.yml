# Temporary: copies the database role passwords from GitHub secrets into
# infra/secrets/olympus.yaml, so nobody has to handle the plaintext. Removed
# again before this PR merges.
name: Migrate olympus secrets to SOPS (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  migrate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/olympus-db-passwords'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install sops
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: .github/scripts/ci-secrets.sh
      - name: Encrypt the passwords to olympus.yaml
        env:
          REFINERY: ${{ secrets.REFINERY_POSTGRES_PASSWORD }}
          ZERO: ${{ secrets.REFINERY_ZERO_POSTGRES_PASSWORD }}
          WGER: ${{ secrets.WGER_POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          for k in REFINERY ZERO WGER; do
            v=${!k}
            if [ -z "$v" ]; then
              echo "::error::$k is empty"
              exit 1
            fi
            case "$v" in
              *$'\n'* | *$'\r'*)
                echo "::error::$k has a newline"
                exit 1
                ;;
            esac
            echo "$k: ${#v} characters"
          done
          # The plaintext only exists in the pipe; .sops.yaml picks the
          # recipients from the file name.
          jq -n '{
            "postgres-refinery-password": env.REFINERY,
            "postgres-zero-password": env.ZERO,
            "postgres-wger-password": env.WGER
          }' |
            "$RUNNER_TEMP/sops" encrypt --input-type json --output-type yaml \
              --filename-override infra/secrets/olympus.yaml /dev/stdin \
              >"$RUNNER_TEMP/olympus.yaml"
          grep -c 'ENC\[' "$RUNNER_TEMP/olympus.yaml"
          grep -c 'recipient:' "$RUNNER_TEMP/olympus.yaml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: olympus-secrets-encrypted
          path: ${{ runner.temp }}/olympus.yaml
