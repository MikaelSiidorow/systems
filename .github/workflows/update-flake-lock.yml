name: Update flake.lock

# Each flake keeps its own lock and gets its own pull request.
# - workstations: fast-moving inputs daily, all inputs on Mondays; auto-merged
#   once the required CI Summary passes.
# - infra: all inputs on Mondays; deploy.yml enables auto-merge unless the
#   k8s-server closure brings a new k3s or kernel minor, or a PostgreSQL or
#   systemd major. The smoke job checks k8s-server after the deploy.
# - openwrt: all inputs daily, since OpenWrt republishes package indexes and
#   the pinned hashes drift; auto-merged once the firmware builds. It runs late
#   in the UTC day: OpenWrt republishes around 02:30 and the ImageBuilder flake
#   commits the matching hashes some time after, usually by 15:00. When the
#   ImageBuilder drops a pinned release, update.sh moves to the next patch
#   release and the PR waits for review. Merging deploys nothing, router
#   deploys stay manual.
on:
  schedule:
    - cron: "17 0 * * 0,2-6"
    - cron: "17 0 * * 1"
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      flake:
        description: "Flake to update"
        type: choice
        options: [workstations, infra, openwrt]
        default: workstations
      target:
        description: "Inputs to update (fast applies to workstations only)"
        type: choice
        options: [fast, all]
        default: fast

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Select flakes and inputs
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_FLAKE: ${{ inputs.flake }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          ws_fast='{"flake":"workstations","target":"fast","command":"make -s update-fast","title":"chore(workstations): update fast inputs","automerge":true}'
          ws_all='{"flake":"workstations","target":"all","command":"make -s update","title":"chore(workstations): update inputs","automerge":true}'
          infra_all='{"flake":"infra","target":"all","command":"nix flake update","title":"chore(infra): update inputs","automerge":false}'
          openwrt_all='{"flake":"openwrt","target":"all","command":"./update.sh","paths":"openwrt/flake.lock,openwrt/*/firmware.nix","title":"chore(openwrt): update inputs","automerge":true}'
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$INPUT_FLAKE/$INPUT_TARGET" in
              workstations/fast) include="$ws_fast" ;;
              workstations/all) include="$ws_all" ;;
              infra/*) include="$infra_all" ;;
              openwrt/*) include="$openwrt_all" ;;
            esac
          elif [ "$SCHEDULE" = "17 22 * * *" ]; then
            include="$openwrt_all"
          elif [ "$SCHEDULE" = "17 0 * * 1" ]; then
            include="$ws_all,$infra_all"
          else
            include="$ws_fast"
          fi
          echo "matrix={\"include\":[$include]}" >> "$GITHUB_OUTPUT"

  update:
    name: Update ${{ matrix.flake }} (${{ matrix.target }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # PRs opened with GITHUB_TOKEN don't trigger CI, so use a GitHub App token.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Update inputs
        id: update
        working-directory: ${{ matrix.flake }}
        env:
          COMMAND: ${{ matrix.command }}
        run: |
          # Fail on a failing $COMMAND, not on grep filtering out every line.
          set -o pipefail
          {
            echo '```'
            $COMMAND 2>&1 | { grep -v -E '^(warning:|unpacking )' || true; }
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          # openwrt/update.sh moves stale release pins; a new OpenWrt release
          # needs its release notes read before merging.
          if git diff --quiet -- '*/firmware.nix'; then
            echo "release-bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "release-bumped=true" >> "$GITHUB_OUTPUT"
            # Repeat the links outside the code fence so GitHub renders them.
            notes=$(grep -oE 'https://openwrt\.org/releases/[^ ]+' "$RUNNER_TEMP/body.md" | sort -u | sed 's/^/- /' || true)
            printf '\nNew OpenWrt release: review its release notes, auto-merge is off.\n\n%s\n' "$notes" >> "$RUNNER_TEMP/body.md"
          fi

      - name: Create pull request
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: update/${{ matrix.flake }}-${{ matrix.target }}
          delete-branch: true
          add-paths: ${{ matrix.paths || format('{0}/flake.lock', matrix.flake) }}
          commit-message: ${{ matrix.title }}
          title: ${{ matrix.title }}
          body-path: ${{ runner.temp }}/body.md
          labels: dependencies

      - name: Enable auto-merge
        if: matrix.automerge && steps.update.outputs.release-bumped != 'true' && steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge --auto --squash "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"

      # The branch is rewritten in place, so auto-merge from an earlier run
      # would otherwise carry over to the release bump.
      - name: Disable auto-merge for release bumps
        if: steps.update.outputs.release-bumped == 'true' && steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          enabled=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [ "$enabled" = true ]; then
            gh pr merge --disable-auto "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          fi
