name: Renovate

# Self-hosted Renovate, authenticated as the mikael-systems-bot GitHub App.
# Also runs for MikaelSiidorow/refinery, which keeps its own renovate.json.
# Configuration lives in renovate.json. T3 revision pins are kept together
# here; other flake inputs are updated by update-flake-lock.yml.
on:
  schedule:
    - cron: "37 3 * * 1"
  # Also run on demand, e.g. after ticking a box on the Dependency Dashboard.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # Unscoped: the token gets every permission granted to the installation.
      # Scoping turns one missing grant into an opaque 422 before Renovate runs.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: systems,refinery

      - name: Run Renovate
        uses: renovatebot/github-action@6d26fcf0275dc65624cbc3d51fe78bc773f98321 # v46.3.6
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: '["MikaelSiidorow/systems","MikaelSiidorow/refinery"]'
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # The only post-upgrade commands a renovate.json may run; no shell.
          # refinery bumps its package.json version, which every PR there needs.
          RENOVATE_ALLOWED_COMMANDS: '["^bash \\.github/scripts/traefik-crds\\.sh [0-9]+\\.[0-9]+\\.[0-9]+$", "^node \\.github/scripts/bump-patch-version\\.mjs$"]'
