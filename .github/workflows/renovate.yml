name: Renovate

# Self-hosted Renovate, authenticated as the mikael-systems-bot GitHub App.
# Also runs for MikaelSiidorow/refinery and MikaelSiidorow/siidorow.com, which
# keep their own renovate.json.
# Configuration lives in renovate.json. T3 revision pins are kept together
# here; other flake inputs are updated by update-flake-lock.yml.
on:
  schedule:
    - cron: "37 3 * * 1"
  # Also run on demand, e.g. after ticking a box on the Dependency Dashboard.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # Unscoped: the token gets every permission granted to the installation.
      # Scoping turns one missing grant into an opaque 422 before Renovate runs.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: systems,refinery,siidorow.com

      - name: Run Renovate
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: '["MikaelSiidorow/systems","MikaelSiidorow/refinery","MikaelSiidorow/siidorow.com"]'
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # The only post-upgrade commands a renovate.json may run; no shell.
          # refinery bumps its package.json version, which every PR there needs.
          RENOVATE_ALLOWED_COMMANDS: '["^bash \\.github/scripts/traefik-crds\\.sh [0-9]+\\.[0-9]+\\.[0-9]+$", "^node scripts/bump-patch-version\\.js$"]'
