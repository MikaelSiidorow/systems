# Temporary: copies the provider tokens from GitHub secrets into
# infra/secrets/ci.yaml, so nobody has to handle the plaintext. Removed again
# before this PR merges.
name: Migrate CI secrets to SOPS (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  migrate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ci-tokens-to-sops'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install sops
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: .github/scripts/ci-secrets.sh
      - name: Write the tokens into ci.yaml
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          for k in HCLOUD_TOKEN CLOUDFLARE_API_TOKEN SCW_SECRET_KEY AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            v=${!k}
            if [ -z "$v" ]; then
              echo "::error::$k is empty"
              exit 1
            fi
            case "$v" in
              *$'\n'* | *$'\r'* | *%*)
                echo "::error::$k has a newline or %, which the loader rejects"
                exit 1
                ;;
            esac
            # Values go in over stdin, JSON-encoded; only the length is printed.
            printf '%s' "$v" | jq -Rs . |
              "$RUNNER_TEMP/sops" set --value-stdin infra/secrets/ci.yaml "[\"$k\"]"
            echo "$k: ${#v} characters"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-secrets-encrypted
          path: infra/secrets/ci.yaml
