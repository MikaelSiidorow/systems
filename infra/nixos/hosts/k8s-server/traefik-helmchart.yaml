apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: traefik
  namespace: kube-system
spec:
  chart: traefik
  repo: https://traefik.github.io/charts
  targetNamespace: traefik
  createNamespace: true
  version: 42.2.0
  valuesContent: |-
    # Keep client addresses for the tailnet-only allowlists. ServiceLB
    # masquerades what it forwards, so kube-proxy has to take the tailnet
    # address too, as it does the public one.
    service:
      spec:
        externalTrafficPolicy: Local
        externalIPs:
          - 100.64.0.1
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
