apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: argocd
  namespace: kube-system
spec:
  chart: argo-cd
  repo: https://argoproj.github.io/argo-helm
  targetNamespace: argocd
  createNamespace: true
  version: 10.9.6
  valuesContent: |-
    configs:
      params:
        server.insecure: "true" # TLS terminated by Traefik ingress
